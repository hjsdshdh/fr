name: Build Nubia Z60 Ultra Kernel (ReSukiSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libelf-dev \
            libssl-dev \
            libz-dev \
            libncurses-dev \
            flex \
            bison \
            bc \
            cpio \
            python3 \
            python3-dev \
            git \
            wget \
            xz-utils \
            make \
            gcc \
            g++ \
            curl \
            dwarves   # 提供 pahole，解决 BTF 生成问题

      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: List output directory (debug)
        run: |
          echo "📂 /home/runner/android_kernel/nx721j_out:"
          ls -lh /home/runner/android_kernel/nx721j_out/ || echo "目录不存在！"
          echo "📂 /home/runner/android_kernel/AnyKernel3:"
          ls -lh /home/runner/android_kernel/AnyKernel3/ || echo "目录不存在！"

      - name: Upload AnyKernel3 ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Kernel
          path: /home/runner/android_kernel/nx721j_out/*.zip
          retention-days: 7
          if-no-files-found: error
