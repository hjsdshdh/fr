name: Build Nubia Z60 Ultra Kernel (ReSukiSU)

on:
  # 手动触发
  workflow_dispatch:
  # 也可在 push 到 main 分支时自动触发（按需开启）
  # push:
  #   branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 内核编译耗时较长，设 6 小时超时

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libelf-dev \
            libssl-dev \
            flex \
            bison \
            bc \
            cpio \
            python3 \
            python3-dev \
            git \
            wget \
            xz-utils

      - name: Build kernel (ReSukiSU with all features enabled)
        run: |
          chmod +x build.sh
          # 选项：4(ReSukiSU) + 7个 y (启用所有功能)
          echo -e "4\ny\ny\ny\ny\ny\ny\ny" | ./build.sh

      - name: Upload AnyKernel3 ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Kernel-$(date +%Y%m%d-%H%M%S)
          path: android_kernel/nx721j_out/AnyKernel3-*.zip
          retention-days: 7
