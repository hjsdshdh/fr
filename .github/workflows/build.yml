name: Build Nubia Z60 Ultra Kernel (ReSukiSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libelf-dev \
            libssl-dev \
            flex \
            bison \
            bc \
            cpio \
            python3 \
            python3-dev \
            git \
            wget \
            xz-utils

      - name: Build kernel (ReSukiSU with all features)
        run: |
          chmod +x build.sh
          echo -e "4\ny\ny\ny\ny\ny\ny\ny" | ./build.sh

      - name: List output directory contents (debug)
        run: |
          echo "Contents of /home/runner/android_kernel/nx721j_out:"
          ls -lh /home/runner/android_kernel/nx721j_out/ || echo "Directory not found!"

      - name: Upload AnyKernel3 ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Kernel-$(date +%Y%m%d-%H%M%S)
          # 使用绝对路径，确保能找到生成的 ZIP
          path: /home/runner/android_kernel/nx721j_out/*.zip
          retention-days: 7
          if-no-files-found: error   # 若没有ZIP文件则让任务失败，便于发现问题
